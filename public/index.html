<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06303D">
  <title>피콕 부르기 · 학교 배달 로봇</title>
  <script>
    // 로봇 태블릿으로 등록된 기기는 로봇 얼굴 화면으로 (그 외 기기는 이 '부르기' 화면)
    try {
      if (localStorage.getItem('kis-robot-device') === '1' && !/[?&]public\b/.test(location.search)) {
        location.replace('robot.html' + location.search + location.hash);
      }
    } catch (e) { /* 저장소를 못 쓰면 그냥 이 화면 */ }
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/call.css">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
</head>
<body>
  <!-- 피콕 부르기 (한국어 / English, ?lang=en): 로봇으로 등록되지 않은 기기가 여는 첫 화면 -->
  <header id="c-top" class="c-top"></header>
  <main class="c-main" id="c-main" aria-live="polite"></main>
  <footer class="c-foot" id="c-foot"></footer>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/hangul.js"></script>
  <script src="js/router.js"></script>
  <script src="js/search.js"></script>
  <script src="js/face.js"></script>
  <script src="js/map.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/call.js"></script>
</body>
</html>
