<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A3D50">
  <title>피콕 부르기 · 학교 배달 로봇</title>
  <script>
    // 로봇 태블릿으로 등록된 기기는 로봇 얼굴 화면으로 (그 외 기기는 이 '부르기' 화면)
    try {
      if (localStorage.getItem('kis-robot-device') === '1' && !/[?&]public\b/.test(location.search)) {
        location.replace('robot.html' + location.search + location.hash);
      }
    } catch (e) { /* 저장소를 못 쓰면 그냥 이 화면 */ }
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/call.css">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
</head>
<body>
  <header class="c-top">
    <div class="c-brand">
      <span class="c-avatar" id="c-avatar"></span>
      <div><b>피콕 부르기</b><span>학교 배달 로봇</span></div>
      <span class="c-status" id="c-status"><i></i><em>확인 중</em></span>
    </div>
  </header>
  <main class="c-main" id="c-main" aria-live="polite"></main>
  <footer class="c-foot">학교 안내·배달 로봇 피콕</footer>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/hangul.js"></script>
  <script src="js/router.js"></script>
  <script src="js/search.js"></script>
  <script src="js/face.js"></script>
  <script src="js/map.js"></script>
  <script src="js/call.js"></script>
</body>
</html>
